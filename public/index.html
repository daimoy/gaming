<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>暗夜赌局 · 游戏大厅</title>
<style>
:root{--bg:#0c0809;--gold:#d4af37;--blood:#8b0000;--text:#e0d5c1;--dim:#887866}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 15%,#2a1218,#0c0809 72%);color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100vh;padding:18px;display:flex;flex-direction:column;align-items:center}
h1{color:var(--gold);font-size:26px;letter-spacing:10px;text-shadow:0 0 24px rgba(212,175,55,.5);margin:12px 0 3px}
.sub{color:var(--dim);font-size:11px;letter-spacing:4px;margin-bottom:24px}
.wrap{width:100%;max-width:560px}
.card{display:block;text-decoration:none;background:linear-gradient(135deg,rgba(34,18,22,.95),rgba(12,8,9,.95));border:1px solid #4a3020;border-radius:9px;padding:20px;margin-bottom:14px;transition:all .25s;position:relative;overflow:hidden}
.card.live:hover{border-color:var(--gold);box-shadow:0 0 22px rgba(212,175,55,.28);transform:translateY(-2px)}
.card.soon{opacity:.5;cursor:default}
.card .gname{color:var(--gold);font-size:20px;letter-spacing:3px;margin-bottom:6px}
.card.soon .gname{color:#9a8a76}
.card .gdesc{color:var(--dim);font-size:12px;line-height:1.7}
.tag{position:absolute;top:16px;right:16px;font-size:10px;letter-spacing:1px;padding:3px 9px;border-radius:20px}
.tag.on{background:#5a1010;color:#ffb0b0;border:1px solid #8b0000}
.tag.off{background:#2a2420;color:#887866;border:1px solid #4a4038}
.foot{color:#5a4e40;font-size:10px;text-align:center;line-height:1.9;margin-top:20px}
</style>
</head>
<body>
<h1>暗 夜 赌 局</h1>
<div class="sub">DARK GAME HALL</div>
<div class="wrap">
  <a class="card live" href="/tenhalf.html">
    <span class="tag on">可玩</span>
    <div class="gname">十点半</div>
    <div class="gdesc">黑暗系扑克 · 双人在线对战 · 支持观战<br>10+半点 = 皇家十点半，三倍赔付</div>
  </a>
  <div class="card soon">
    <span class="tag off">筹备中</span>
    <div class="gname">更多游戏</div>
    <div class="gdesc">后续在这里添加新游戏<br>（把新游戏页面和入口加进来即可）</div>
  </div>
</div>
<div class="foot">把本站链接发给微信好友 · 点进去选游戏即可一起玩<br>纯代码练手项目 · 免费部署</div>
</body>
</html>
