<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>十点半 · 暗夜赌局</title>
<style>
:root{--bg:#0c0809;--gold:#d4af37;--blood:#8b0000;--text:#e0d5c1;--dim:#887866}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 20%,#2a1218,#0c0809 72%);color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100vh;padding:12px;display:flex;flex-direction:column;align-items:center}
h1{color:var(--gold);font-size:22px;letter-spacing:7px;text-shadow:0 0 22px rgba(212,175,55,.5);margin:6px 0 2px}
.sub{color:var(--dim);font-size:10px;letter-spacing:3px;margin-bottom:12px}
.wrap{width:100%;max-width:680px}
.panel{background:linear-gradient(135deg,rgba(30,16,20,.95),rgba(12,8,9,.95));border:1px solid #3a2520;border-radius:8px;padding:14px;margin-bottom:10px}
.label{color:var(--gold);font-size:13px;letter-spacing:2px;margin-bottom:10px;display:block}
input{width:100%;background:#1a0f14;border:1px solid #4a3020;color:var(--gold);padding:11px;text-align:center;font-family:inherit;font-size:15px;border-radius:4px;margin-bottom:10px}
button{background:linear-gradient(135deg,#3a1a1a,#1a0a0a);border:1px solid var(--gold);color:var(--gold);padding:11px 14px;font-size:14px;cursor:pointer;border-radius:4px;font-family:inherit;letter-spacing:2px;transition:all .2s;width:100%;margin-top:7px}
button:hover:not(:disabled){background:linear-gradient(135deg,#5a2a2a,#2a1a1a);box-shadow:0 0 14px rgba(212,175,55,.3)}
button:disabled{opacity:.3;cursor:not-allowed}
button.primary{background:linear-gradient(135deg,#5a1010,#2a0808);border-color:#e05050;color:#ffd0d0}
.player{border:1px solid #3a2520;border-radius:6px;padding:9px 12px;margin-bottom:8px;transition:all .3s;background:rgba(20,10,14,.6);position:relative}
.player.active{border-color:var(--gold);box-shadow:0 0 16px rgba(212,175,55,.22)}
.player.me{background:rgba(40,24,16,.55);border-color:#6a4a20}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px}
.pn{color:var(--gold)}.ch{color:#c9a227;font-size:12px}
.badge{display:inline-block;padding:1px 6px;border-radius:3px;background:#3a1a1a;color:#e05050;font-size:10px;margin-left:5px}
.host{color:#ffd700;font-size:12px;margin-left:4px}
.cards{display:flex;gap:5px;flex-wrap:wrap;min-height:70px}
.card{width:50px;height:70px;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;box-shadow:0 3px 7px rgba(0,0,0,.6)}
.card.down{background:repeating-linear-gradient(45deg,#3a0808,#3a0808 6px,#2a0404 6px,#2a0404 12px);border:2px solid #6a1515}
.card.down::before{content:'⛧';font-size:26px;color:#8b1515}
.card.up{background:linear-gradient(160deg,#241518,#120a0c);border:2px solid #7a5a30;color:var(--gold)}
.card.half{border-color:var(--blood);color:#e05050;background:linear-gradient(160deg,#2a0e14,#120508)}
.card .r{font-size:18px}.card .s{font-size:12px}.card .v{font-size:9px;opacity:.6}
.sc{color:var(--dim);font-size:12px;margin-top:4px}.royal{color:#ffd700!important;text-shadow:0 0 10px #ffd700}
.info{text-align:center;margin:6px 0;font-size:14px;color:var(--gold)}
.round{color:#ffd700;font-size:13px;letter-spacing:2px}
.msg{color:#d05050;font-size:14px;min-height:20px;text-align:center;text-shadow:0 0 8px rgba(208,80,80,.4);margin:6px 0}
.btns{display:flex;gap:7px;flex-wrap:wrap}.btns button{flex:1;min-width:90px;margin-top:6px}
.row{display:flex;gap:7px}.row button{margin-top:0}
.share{background:rgba(212,175,55,.08);border:1px dashed #7a5a30;border-radius:5px;padding:9px;font-size:12px;color:var(--gold);text-align:center;word-break:break-all;margin-top:8px}
.tiny{color:#665a4c;font-size:10px;line-height:1.7;margin-top:12px;text-align:center}
.hide{display:none!important}
.skull{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(60,0,0,.55);border-radius:6px;z-index:5;animation:bloodIn .4s ease}
.skull .ico{font-size:64px;line-height:1;text-shadow:0 0 26px #ff0000;animation:pulse 1s infinite}
.skull .txt{color:#ff4444;font-size:20px;letter-spacing:6px;font-weight:bold;text-shadow:0 0 14px #ff0000;margin-top:4px}
@keyframes bloodIn{from{opacity:0;transform:scale(1.15)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.banner{text-align:center;padding:14px 10px;border-radius:8px;margin:8px 0;font-size:22px;font-weight:bold;letter-spacing:4px;text-shadow:0 0 18px currentColor}
.banner.win{color:#ffd700;border:2px solid #d4af37;background:rgba(212,175,55,.12)}
.banner.lose{color:#ff5555;border:2px solid #8b0000;background:rgba(139,0,0,.18)}
.banner.draw{color:#c9bda8;border:2px solid #665a4c;background:rgba(102,90,76,.15)}
/* 聊天框 */
.chatBox{border:1px solid #3a2520;border-radius:8px;background:rgba(12,8,9,.9);display:flex;flex-direction:column;height:220px}
.chatHead{color:var(--gold);font-size:13px;letter-spacing:2px;padding:9px 12px;border-bottom:1px solid #3a2520}
.chatLog{flex:1;overflow-y:auto;padding:8px 12px;font-size:13px;line-height:1.6}
.chatLog .m{margin-bottom:5px;word-break:break-word}
.chatLog .nm{color:var(--gold);margin-right:6px}
.chatLog .sys{color:#665a4c;font-style:italic}
.chatIn{display:flex;border-top:1px solid #3a2520}
.chatIn input{margin:0;border:0;border-radius:0;flex:1;font-size:14px;padding:10px 12px}
.chatIn button{width:64px;margin:0;border-radius:0;border:0;border-left:1px solid #3a2520;padding:10px 0}
</style>
</head>
<body>
<h1>十 点 半</h1>
<div class="sub">暗 夜 赌 局 · ROYAL TEN &amp; HALF</div>
<div class="wrap">
  <div id="lobby">
    <div class="panel">
      <span class="label">你的昵称</span>
      <input id="nick" placeholder="输入昵称" maxlength="10">
      <button class="primary" onclick="act('quickmatch')">⚔ 快速匹配对手</button>
      <button onclick="act('create')">＋ 创建房间（发链接约人）</button>
      <div class="row" style="margin-top:7px">
        <input id="codeIn" placeholder="输入房间号" maxlength="6" style="margin:0">
        <button onclick="act('joincode')" style="width:110px;margin:0">加入</button>
      </div>
      <div id="waitTip" class="share hide">正在寻找对手…</div>
    </div>
    <div class="tiny">A=1 · 2-10面值 · J/Q/K/大小王=半点 · 首张暗牌 · 超10.5爆牌 · 10+半点=皇家十点半赢3倍 · 初始筹码20</div>
  </div>

  <div id="game" class="hide">
    <div class="panel">
      <div class="info">底池 <span id="pot">0</span>　赌注 <span id="cbet">0</span>　<span id="specN" class="hide">👁 <span id="specC">0</span> 观战</span></div>
      <div class="round" id="roundTxt">第 1 局</div>
      <div class="msg" id="msg"></div>
      <div id="banner"></div>
      <!-- 对手（上方） -->
      <div class="player" id="pOpp"><div class="ph"><span class="pn" id="nOpp"></span><span class="ch">筹码 <span id="cOpp">20</span></span></div><div class="cards" id="hOpp"></div><div class="sc">点数 <span id="sOpp">?</span></div><div class="skull hide" id="skullOpp"><div class="ico">💀</div><div class="txt">爆牌·死亡</div></div></div>
      <!-- 自己（下方靠近玩家） -->
      <div class="player me" id="pMe"><div class="ph"><span class="pn" id="nMe"></span><span class="ch">筹码 <span id="cMe">20</span></span></div><div class="cards" id="hMe"></div><div class="sc">点数 <span id="sMe">?</span></div><div class="skull hide" id="skullMe"><div class="ico">💀</div><div class="txt">爆牌·死亡</div></div></div>
      <div id="ctrl"></div>
      <div class="share" id="shareBox"></div>
      <div class="btns" style="margin-top:8px"><button id="btnLeave" onclick="location.reload()">离开房间</button></div>
    </div>
    <div class="chatBox">
      <div class="chatHead">💬 房间聊天</div>
      <div class="chatLog" id="chatLog"></div>
      <div class="chatIn"><input id="chatInput" placeholder="说点什么…" maxlength="80" onkeydown="if(event.key==='Enter')sendChat()"><button onclick="sendChat()">发送</button></div>
    </div>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let mySeat = -1, myRole = '', roomCode = '', spectator = false;
const $ = id => document.getElementById(id);
const nick = () => ($('nick').value || '神秘人').trim();
let oppSeat = -1; // 对手座位（视角翻转用）

function act(type) {
  const name = nick();
  localStorage.setItem('th_nick', name);
  if (type === 'create') socket.emit('create', name);
  if (type === 'quickmatch') { $('waitTip').classList.remove('hide'); socket.emit('quickmatch', name); }
  if (type === 'joincode') {
    const code = $('codeIn').value.trim().toUpperCase();
    if (code) socket.emit('join', { code, name }); else alert('请输入房间号');
  }
}
socket.on('waiting', () => $('waitTip').classList.remove('hide'));
socket.on('error', msg => alert(msg));
socket.on('joined', d => {
  myRole = d.role; mySeat = d.seat ?? -1; roomCode = d.code; spectator = d.role === 'spectator';
  $('waitTip').classList.add('hide');
  $('lobby').classList.add('hide'); $('game').classList.remove('hide');
  const url = location.origin + '/tenhalf.html?room=' + roomCode;
  $('shareBox').innerHTML = spectator
    ? '👁 你正在观战 · 房间 ' + roomCode
    : '房间号 <b>' + roomCode + '</b><br>把链接发到微信约人：<br>' + url +
      '<br><button style="margin-top:8px" onclick="copyLink(\'' + url + '\')">复制链接</button>';
});
function copyLink(url) {
  navigator.clipboard.writeText(url).then(() => alert('已复制，发到微信即可')).catch(() => prompt('复制这个链接：', url));
}

function renderCard(c) {
  if (c.hidden) return '<div class="card down"></div>';
  const half = c.value === 0.5 ? ' half' : '';
  const rank = c.rank === 'JOKER' ? '🃏' : c.rank;
  const suit = c.rank === 'JOKER' ? '' : c.suit;
  return '<div class="card up' + half + '"><span class="r">' + rank + '</span><span class="s">' + suit + '</span><span class="v">' + c.value + '</span></div>';
}
function addChat(name, text, sys) {
  const div = document.createElement('div');
  div.className = 'm';
  div.innerHTML = sys ? '<span class="sys">' + text + '</span>' : '<span class="nm">' + name + '：</span>' + escapeHtml(text);
  $('chatLog').appendChild(div);
  $('chatLog').scrollTop = $('chatLog').scrollHeight;
}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function sendChat(){
  const v=$('chatInput').value.trim(); if(!v)return;
  socket.emit('chat', v); $('chatInput').value='';
}
socket.on('chat', d => addChat(d.name, d.text, false));

function render(st) {
  $('pot').textContent = st.pot; $('cbet').textContent = st.currentBet;
  $('roundTxt').textContent = '第 ' + st.roundNo + ' 局';
  $('msg').textContent = st.note || (st.result ? st.result.text : '');
  if (st.spectators > 0) { $('specN').classList.remove('hide'); $('specC').textContent = st.spectators; }
  else $('specN').classList.add('hide');

  // 视角翻转：玩家看自己坐下方(meSeat=st.you)，对手坐上方；观战者固定 0上1下
  const meSeat = spectator ? 1 : (st.you >= 0 ? st.you : 0);
  oppSeat = 1 - meSeat;
  function paint(seat, pfx) {
    const p = st.seats[seat];
    if (!p) return;
    const isMe = seat === st.you;
    $('n'+pfx).innerHTML = p.name + (isMe ? '（你）' : '') + (seat === st.hostSeat ? '<span class="host">👑东家</span>' : '');
    $('c'+pfx).textContent = p.chips;
    $('h'+pfx).innerHTML = p.cards.length ? p.cards.map(renderCard).join('') : '';
    const scEl = $('s'+pfx);
    scEl.textContent = p.bust ? '爆' : (p.score !== null ? p.score : '?');
    scEl.className = '';
    if (p.bust || p.stood) scEl.classList.add('badge');
    if (st.result && st.result.royal && st.winnerSeat === seat) scEl.classList.add('royal');
    $('p'+pfx).classList.toggle('active', st.turn === seat && (st.phase === 'betting' || st.phase === 'drawing'));
    // 骷髅头：爆牌时显示（结算阶段才亮，避免提前暴露）
    const showSkull = p.bust && (st.phase === 'result' || st.phase === 'gameover');
    $('skull'+pfx).classList.toggle('hide', !showSkull);
  }
  paint(oppSeat, 'Opp');
  paint(meSeat, 'Me');

  // 胜负横幅（结算/结束时）
  const b = $('banner'); b.innerHTML = '';
  if (st.phase === 'result' || st.phase === 'gameover') {
    const r = st.result || {};
    if (r.gameOver) {
      const iWon = st.you >= 0 && r.championSeat === st.you;
      b.innerHTML = spectator
        ? '<div class="banner draw">🏆 ' + escapeHtml(st.seats[r.championSeat]?.name||'') + ' 赢下整场</div>'
        : '<div class="banner ' + (iWon?'win':'lose') + '">' + (iWon?'🏆 你赢了 · 对手筹码输光':'💀 你输了 · 筹码输光') + '</div>';
    } else if (st.winnerSeat === -1) {
      b.innerHTML = '<div class="banner draw">平局 · 退还赌注</div>';
    } else {
      const iWon = st.you >= 0 && st.winnerSeat === st.you;
      b.innerHTML = spectator
        ? '<div class="banner draw">' + escapeHtml(st.seats[st.winnerSeat]?.name||'') + ' 获胜</div>'
        : '<div class="banner ' + (iWon?'win':'lose') + '">' + (iWon?'✨ 你赢了':'💀 你输了') + (r.royal?' · 皇家十点半×3':'') + '</div>';
    }
  }

  const c = $('ctrl'); c.innerHTML = '';
  if (spectator) { c.innerHTML = '<div class="msg">👁 观战模式 · 等待玩家操作</div>'; return; }
  const myTurn = st.turn === mySeat;
  const isHost = mySeat === st.hostSeat;
  if (st.phase === 'betting') {
    if (st.currentBet === 0 && myTurn) {
      c.innerHTML = '<div class="row"><input id="amt" type="number" value="5" min="1" max="' + (st.seats[mySeat]?.chips||20) + '"><button class="primary" onclick="bet(\'bet\')">下注</button></div><button onclick="bet(\'fold\')">弃牌</button>';
    } else if (myTurn) {
      const callN = Math.max(0, st.currentBet - (st.seats[mySeat]?.bet||0));
      c.innerHTML = '<div class="btns"><button class="primary" onclick="bet(\'call\')">跟注 ' + callN + '</button><button onclick="bet(\'fold\')">弃牌</button></div><div class="row" style="margin-top:7px"><input id="amt" type="number" min="' + (st.currentBet+1) + '" placeholder="加注到…"><button onclick="bet(\'raise\')">加注</button></div>';
    } else {
      c.innerHTML = '<div class="msg">等待对手下注…</div>';
    }
  } else if (st.phase === 'drawing') {
    if (myTurn) c.innerHTML = '<div class="btns"><button class="primary" onclick="draw(\'hit\')">要牌</button><button onclick="draw(\'stand\')">停牌</button></div>';
    else c.innerHTML = '<div class="msg">等待对手要牌…</div>';
  } else if (st.phase === 'result' || st.phase === 'gameover') {
    if (!isHost) {
      c.innerHTML = '<div class="msg">⏳ 等待东家' + (st.phase==='gameover'?'重开':'开下一局') + '…</div>';
    } else if (st.phase === 'gameover') {
      c.innerHTML = '<button class="primary" onclick="restart()">👑 重开一局（东家）</button>';
    } else {
      c.innerHTML = '<button class="primary" onclick="next()">👑 下一局（东家）</button>';
    }
  }
}
function bet(action) { const el = $('amt'); socket.emit('bet', { action, amount: el ? Number(el.value) : 0 }); }
function draw(action) { socket.emit('draw', action); }
function next() { socket.emit('next'); }
function restart() { socket.emit('restart'); }
socket.on('state', render);

// 微信分享链接带房间号 → 自动进入（昵称存本地）
const savedNick = localStorage.getItem('th_nick');
if (savedNick) $('nick').value = savedNick;
const q = new URLSearchParams(location.search).get('room');
if (q) {
  $('codeIn').value = q;
  socket.emit('join', { code: q, name: (savedNick||'').trim() || '玩家' });
}
</script>
</body>
</html>
